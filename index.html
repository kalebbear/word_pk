</style></head><body><header><div class="brand"><b>W</b>单词 PK <span class="muted" style="font-size:12px">红蓝挑战赛</span></div><nav><button class="ghost small" data-go="home">首页</button><button class="ghost small" data-go="library">我的词库</button><button class="ghost small" id="sound">音效：开</button><button class="ghost small" id="fullscreen">⛶ 全屏</button></nav></header><main id="app"></main><footer>选好单元，叫上队友，开始挑战！</footer><div id="toast" role="status" hidden></div><div class="bomb-explosion" id="bombExplosion" role="status" aria-live="assertive" hidden><div class="explosion-burst" aria-hidden="true">💥</div><strong>时间到！</strong><p>来看看两队的成绩吧！</p></div><dialog id="help"><h2>准备好挑战了吗？</h2><p class="muted">1. 选择一个单元和挑战方式，给红蓝战队起个名字。</p><p class="muted">2. 两队同时答题，点击自己这边的云朵，选择正确答案。</p><p class="muted">3. 答对 +1 分，答错不扣分。下一题会自动出现，继续加油！</p><p class="muted">留意炸弹的引线：它会越烧越短，烧完就到时间啦！得分高的战队获胜；两队分数一样就是平局。</p><p class="muted">挑战结束后，看看选错的单词，记住它们，再来一局！</p><button class="primary" id="closeHelp">我知道怎么玩了</button></dialog><script>
'use strict';
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parseWords(text){const words=[],errors=[];text.replace(/\r\n?/g,'\n').split('\n').forEach((line,i)=>{if(!line.trim())return;const m=line.match(/^([^,，]+)[,，](.+)$/);if(!m||!m[1].trim()||!m[2].trim()||m[1].split(/[；;|]/).some(x=>!x.trim())||m[2].split(/[；;|]/).some(x=>!x.trim()))errors.push({line:i+1,text:line});else words.push({en:m[1].trim().replace(/[|;]/g,'；'),zh:m[2].trim().replace(/[|;]/g,'；')})});return{words,errors}}

function config(){if(!lib()){view='library';library();return}const c=store.config;app.innerHTML='<div class="eyebrow">READY, SET, PLAY</div><h2 style="margin:12px 0 25px">战队集合，准备开赛！</h2><div class="grid"><section class="card"><h3>这次挑战什么？</h3><label for="chosenLib">选择单元</label><select class="wide" id="chosenLib">'+store.libraries.map(l=>'<option value="'+l.id+'" '+(l.id===store.selected?'selected':'')+'>'+esc(l.name)+' · '+l.words.length+' 题</option>').join('')+'</select><label for="mode">挑战方式</label><select class="wide" id="mode"><option value="en">英译汉 · 看英文，选中文</option><option value="zh">汉译英 · 看中文，选英文</option><option value="mix">随机混合 · 双向挑战</option></select><label for="seconds">挑战时长</label><select class="wide" id="seconds">'+[30,60,120,180,300].map(s=>'<option value="'+s+'">'+s+' 秒</option>').join('')+'</select><label><input type="checkbox" id="random"> 随机出题顺序</label></section><section class="card"><h3>给战队起个名字</h3><label class="red" for="redName">● 红方队伍名称</label><input class="wide" id="redName" maxlength="20"><label class="blue-text" for="blueName">● 蓝方队伍名称</label><input class="wide" id="blueName" maxlength="20"><p class="muted" style="margin-top:28px">红蓝两队同时出发！点击自己这边的云朵答案，答对 +1 分，自动进入下一题。引线烧完时，得分高的战队获胜。</p><button class="primary wide" id="launch" style="margin-top:20px">开始对战　↗</button></section></div>';$('#mode').value=['en','zh','mix'].includes(c.mode)?c.mode:'en';$('#seconds').value=[30,60,120,180,300].includes(+c.seconds)?c.seconds:60;$('#random').checked=c.random;$('#redName').value=c.red;$('#blueName').value=c.blue;$('#launch').onclick=()=>{store.selected=$('#chosenLib').value;store.config={mode:$('#mode').value,seconds:+$('#seconds').value,red:$('#redName').value.trim()||'红队',blue:$('#blueName').value.trim()||'蓝队',random:$('#random').checked};persist();startGame()}}

function shuffle(list){const a=[...list];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeDeck(){let a=lib().words.map(w=>({...w,mode:store.config.mode==='mix'?(Math.random()<.5?'en':'zh'):store.config.mode}));return store.config.random?shuffle(a):a}
function choicesFor(q){const field=q.mode==='en'?'zh':'en',promptField=q.mode==='en'?'en':'zh';const answer=q[field].split(/[；;|]/)[0].trim(),accepted=new Set(q[field].split(/[；;|]/).map(norm)),seen=new Set([norm(answer)]);const candidates=shuffle([...lib().words,...store.libraries.filter(l=>l.id!==store.selected).flatMap(l=>l.words)]),options=[{text:answer,correct:true}];for(const w of candidates){const text=w[field].split(/[；;|]/)[0].trim();if(norm(w[promptField])===norm(q[promptField])||w[field].split(/[；;|]/).some(x=>accepted.has(norm(x)))||seen.has(norm(text)))continue;seen.add(norm(text));options.push({text,correct:false});if(options.length===6)break}return shuffle(options)}
function startGame(){clearInterval(timer);game={id:Date.now()+Math.random(),deadline:Date.now()+store.config.seconds*1000,ended:false,scores:{red:0,blue:0},records:[],sides:{red:{questions:makeDeck(),index:0,locked:false},blue:{questions:makeDeck(),index:0,locked:false}}};view='battle';document.body.classList.add('playing');battle()}
function sound(good){if(!store.sound)return;try{audioContext??=new(window.AudioContext||window.webkitAudioContext)();audioContext.resume().catch(()=>{});[0,.12].forEach((delay,i)=>{const o=audioContext.createOscillator(),gain=audioContext.createGain();o.type='sine';o.frequency.value=good?(i?880:660):(i?180:260);gain.gain.setValueAtTime(.12,audioContext.currentTime+delay);gain.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+delay+.2);o.connect(gain);gain.connect(audioContext.destination);o.start(audioContext.currentTime+delay);o.stop(audioContext.currentTime+delay+.22)})}catch{}}

function battle(){const c=store.config;app.innerHTML='<div class="pk-top"><div class="pk-chip" id="chip-red"></div><div class="row"><button id="end">提前结束</button><div class="bomb-timer" id="timer" role="timer" aria-label="比赛剩余时间"><svg viewBox="0 0 400 145" aria-hidden="true"><defs><radialGradient id="bombMetal" cx="30%" cy="25%" r="85%"><stop offset="0" stop-color="#fff2ae"/><stop offset=".55" stop-color="#ffc66b"/><stop offset="1" stop-color="#f2a64b"/></radialGradient></defs><path d="M69 44 L78 30" stroke="#b9904c" stroke-width="7"/><rect x="56" y="37" width="24" height="15" rx="4" fill="#cba65e" transform="rotate(20 68 44)"/><path id="bombFuse" class="fuse-live" d="M78 30 C178 0 278 60 378 30" fill="none" pathLength="100" stroke-dasharray="100 100"/><g id="bombSpark" transform="translate(378 30)"><g class="bomb-spark"><path d="M0 -12 L3 -4 L11 -7 L6 0 L13 4 L4 5 L3 13 L-2 6 L-10 10 L-6 2 L-13 -2 L-4 -4 L-6 -12 L0 -7Z" fill="#ffb126"/><circle r="4" fill="#fff6ad"/></g></g><circle class="bomb-body" cx="65" cy="91" r="46"/><ellipse class="bomb-shine" cx="46" cy="66" rx="15" ry="7" transform="rotate(-35 46 66)"/><rect x="25" y="76" width="80" height="31" rx="8" fill="#fff4d4"/><text class="bomb-digits" id="timeValue" x="65" y="98" text-anchor="middle">00:00</text><text class="bomb-caption" id="bombCaption" x="265" y="79" text-anchor="middle">剩余时间</text><text class="bomb-caption" x="265" y="97" text-anchor="middle">争分夺秒</text></svg></div><button id="battleFullscreen">⛶ 全屏</button></div><div class="pk-chip blue-chip" id="chip-blue"></div></div><div class="pk-boards"><section class="pk-side" id="side-red"></section><section class="pk-side blue-side" id="side-blue"></section><div class="pk-center" aria-hidden="true">PK</div></div><div class="pk-options-note">'+esc(lib().name)+' · 点击选项作答 · 两队独立推进 · 答对 +1 分</div>';$('#end').onclick=()=>{if(confirm('提前结束比赛并查看成绩？'))finish()};$('#battleFullscreen').onclick=()=>$('#fullscreen').click();drawSide('red');drawSide('blue');clearInterval(timer);tick();timer=setInterval(tick,100)}
function drawSide(team){const g=game,s=g.sides[team],q=s.questions[s.index],name=esc(store.config[team]);s.locked=false;$('#chip-'+team).innerHTML=name+' <b>'+g.scores[team]+'</b> 分 · 已答 '+s.index+' 题';if(!q){$('#side-'+team).innerHTML='<div class="side-head"><h2>'+name+'</h2></div><div class="pk-done">✓ 本队题目已完成<br><p>答对 '+g.scores[team]+' / '+s.questions.length+' 题</p><small>等待另一队完成或倒计时结束</small></div>';s.locked=true;return}s.options=choicesFor(q);$('#side-'+team).innerHTML='<div class="side-head"><h2><span aria-hidden="true">'+(team==='red'?'🔴':'🔵')+'</span> '+name+'</h2><span class="side-count">答对 <b>'+g.scores[team]+'</b> / 已答 <b>'+s.index+'</b></span></div><div class="pk-question"><strong>'+esc((q.mode==='en'?q.en:q.zh).split(/[；;|]/)[0])+'</strong></div><div class="pk-direction">'+(q.mode==='en'?'选择正确的中文释义':'选择正确的英文单词')+' · 第 '+(s.index+1)+' / '+s.questions.length+' 题</div><div class="cloud-grid">'+s.options.map((o,i)=>'<button class="cloud-option" data-choice="'+i+'" data-side="'+team+'" data-question="'+s.index+'">'+esc(o.text)+'</button>').join('')+'</div><div class="side-feedback" id="feedback-'+team+'" role="status">点击云朵，选出正确答案</div>'}
function choose(team,index,questionIndex){const g=game;if(!g||g.ended||g.expiring||view!=='battle')return;if(Date.now()>=g.deadline){tick();return}const s=g.sides[team];if(!s||s.locked||s.index!==questionIndex||!s.options[index])return;s.locked=true;const q=s.questions[s.index],o=s.options[index],expected=q.mode==='en'?q.zh:q.en;g.records.push({q,team,answer:o.text,expected,good:o.correct,reason:'answer'});if(o.correct)g.scores[team]++;s.index++;$('#chip-'+team).innerHTML=esc(store.config[team])+' <b>'+g.scores[team]+'</b> 分 · 已答 '+s.index+' 题';document.querySelectorAll('#side-'+team+' [data-choice]').forEach((b,i)=>{b.disabled=true;b.classList.add(s.options[i].correct?'correct-choice':i===index?'wrong-choice':'faded')});$('#feedback-'+team).className='side-feedback '+(o.correct?'good':'bad');$('#feedback-'+team).textContent=o.correct?'✓ 答对了！+1 分':'答错了，正确答案：'+expected;sound(o.correct);const id=g.id;setTimeout(()=>{if(view!=='battle'||game.id!==id||g.ended)return;if(Date.now()>=g.deadline){tick();return}if(['red','blue'].every(t=>g.sides[t].index>=g.sides[t].questions.length)){finish();return}drawSide(team)},950)}
function tick(){if(!game||game.ended||game.expiring||view!=='battle')return;const remaining=Math.max(0,game.deadline-Date.now()),sec=Math.ceil(remaining/1000),ratio=Math.min(1,remaining/(store.config.seconds*1000));$('#timeValue').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');$('#timer').setAttribute('aria-label','比赛剩余 '+sec+' 秒');$('#timer').classList.toggle('urgent',sec<=10&&sec>0);$('#timer').classList.toggle('critical',sec<=5&&sec>0);$('#bombCaption').textContent=sec<=10?'即将引爆':'剩余时间';const fuse=$('#bombFuse');fuse.setAttribute('stroke-dasharray',(ratio*100).toFixed(3)+' 100');const tip=fuse.getPointAtLength(fuse.getTotalLength()*ratio);$('#bombSpark').setAttribute('transform','translate('+tip.x.toFixed(2)+' '+tip.y.toFixed(2)+')');if(!remaining)explodeBomb()}
function explodeBomb(){const g=game;if(!g||g.ended||g.expiring||view!=='battle')return;g.expiring=true;clearInterval(timer);$('#timeValue').textContent='00:00';$('#timer').classList.remove('urgent','critical');$('#timer').classList.add('expired');$('#bombCaption').textContent='时间到';$('#bombExplosion').hidden=false;document.querySelectorAll('[data-choice]').forEach(b=>b.disabled=true);sound(false);setTimeout(()=>{if(game===g&&view==='battle'&&!g.ended)finish();else $('#bombExplosion').hidden=true},1000)}
function finish(){if(!game||game.ended)return;$('#bombExplosion').hidden=true;clearInterval(timer);game.ended=true;game.unfinished=['red','blue'].flatMap(t=>game.sides[t].questions.slice(game.sides[t].index).map(q=>({...q,team:t})));game.total=game.sides.red.questions.length+game.sides.blue.questions.length;store.history.push({finishedAt:new Date().toISOString(),playMode:'split-choice',library:{id:lib().id,name:lib().name},config:{...store.config},total:game.total,scores:{...game.scores},records:game.records,unfinished:game.unfinished});persist();view='result';document.body.classList.remove('playing');result()}
function result(){const g=game,c=store.config,total=g.total,done=g.records.length,wrong=g.records.filter(r=>!r.good),unfinished=g.unfinished;const winner=g.scores.red===g.scores.blue?'势均力敌，平局！':c[g.scores.red>g.scores.blue?'red':'blue']+' 获胜！';app.innerHTML='<section class="card result"><div class="eyebrow">挑战完成</div><h1 style="font-size:42px">'+esc(winner)+'</h1><p class="muted">左右独立答题 · 每答对一题 +1 分</p><div class="result-score"><span class="red">'+g.scores.red+'</span><span style="color:#646a83;padding:0 28px">:</span><span class="blue-text">'+g.scores.blue+'</span></div><div class="row" style="justify-content:center"><span class="red">'+esc(c.red)+'</span><span class="muted">VS</span><span class="blue-text">'+esc(c.blue)+'</span></div></section><div class="stats"><div class="card"><strong>'+done+'</strong><span class="muted">两队合计已答 / 共 '+total+' 题</span><p class="muted">每队 '+g.sides.red.questions.length+' 题</p></div>'+['red','blue'].map(t=>{const records=g.records.filter(r=>r.team===t);return '<div class="card"><strong class="'+(t==='red'?'red':'blue-text')+'">'+esc(c[t])+'</strong><p>'+g.scores[t]+' 对 / '+(records.length-g.scores[t])+' 错</p><span class="muted">正确率 '+(records.length?Math.round(g.scores[t]/records.length*100):0)+'%</span></div>'}).join('')+'<div class="card"><strong>'+unfinished.length+'</strong><span class="muted">两队合计未作答</span><p class="muted">未作答不计入正确率</p></div></div><section class="card"><div class="row between"><h2>这些单词，再记一次</h2><span class="badge">'+wrong.length+' 道再挑战</span></div>'+(wrong.length?wrong.map(r=>'<div class="review"><div><strong>'+esc((r.q.mode==='en'?r.q.en:r.q.zh).split(/[；;|]/)[0])+'</strong><div class="muted">'+esc(c[r.team])+' · 选择：'+esc(r.answer)+'</div></div><div><span class="valid">标准答案</span><p>'+esc(r.expected)+'</p></div></div>').join(''):'<div class="empty">'+(done?'本局已答题目全部正确！':'本局尚未作答。')+'</div>')+(unfinished.length?'<details style="margin-top:20px"><summary>查看 '+unfinished.length+' 道未作答题目</summary>'+unfinished.map(q=>'<p class="muted">'+esc(c[q.team])+' · '+esc(q.en)+' — '+esc(q.zh)+'</p>').join('')+'</details>':'')+'</section><div class="row" style="justify-content:center;margin-top:28px"><button class="primary" id="again">再来一局</button><button data-go="config">换个挑战</button><button data-go="home">返回首页</button></div>';$('#again').onclick=startGame}

app.addEventListener('keydown',e=>{if(e.target.matches('[data-library]')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();selectLibrary(e.target.dataset.library)}});
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b){const card=e.target.closest('[data-library]');if(card)selectLibrary(card.dataset.library);return;}if(b.dataset.choice!==undefined){choose(b.dataset.side,+b.dataset.choice,+b.dataset.question);return}if(b.dataset.go)go(b.dataset.go);if(b.dataset.select){selectLibrary(b.dataset.select)}if(b.dataset.edit){selectLibrary(b.dataset.edit)}if(b.dataset.delete){const l=store.libraries.find(x=>x.id===b.dataset.delete);if(confirm('确定删除词库「'+l.name+'」？')){store.libraries=store.libraries.filter(x=>x.id!==l.id);if(store.selected===l.id)store.selected=store.libraries[0]?.id||null;if(editing===l.id)editing=null;persist();library()}}});
document.querySelectorAll('header [data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));$('#sound').onclick=()=>{store.sound=!store.sound;persist();$('#sound').textContent='音效：'+(store.sound?'开':'关')};$('#fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else toast('此浏览器请使用系统全屏或横屏功能。')}catch{toast('无法进入全屏，可使用浏览器的全屏菜单。')}};$('#closeHelp').onclick=()=>$('#help').close();document.addEventListener('visibilitychange',()=>{if(view==='battle'&&!document.hidden)tick()});window.addEventListener('beforeunload',e=>{if(unsaved){e.preventDefault();e.returnValue=''}});render();if(startupNotice)toast(startupNotice);
</script></body></html>
